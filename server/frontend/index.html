<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lernstand · Semester 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="anmeldung" class="anmeldung" hidden>
    <form id="login-form" class="anmeldung__karte">
      <p class="kicker">Semester 3</p>
      <h1>Lernstand</h1>
      <label for="passwort">Passwort</label>
      <input id="passwort" type="password" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
      <p id="login-fehler" class="fehler" role="alert"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="kopf">
      <div>
        <p class="kicker">Semester 3 · Stand aus dem Quell-Repo</p>
        <h1>Lernstand</h1>
      </div>
      <div class="kopf__zahl" aria-live="polite">
        <span id="gesamt-beherrscht" class="zahl">0</span>
        <span class="kopf__von">von <span id="gesamt-anzahl">0</span> beherrscht</span>
      </div>
      <button id="abmelden" class="leise" type="button">Abmelden</button>
    </header>

    <section class="legende" aria-label="Level">
      <span><i class="pips" data-level="1"></i>50 %</span>
      <span><i class="pips" data-level="2"></i>65 %</span>
      <span><i class="pips" data-level="3"></i>80 %</span>
      <span><i class="pips" data-level="4"></i>95 % · beherrscht</span>
      <span><i class="pips" data-level="5"></i>100 %</span>
    </section>

    <section id="faecher" class="faecher" aria-label="Fächer"></section>
    <p id="meldung" class="fehler" role="alert"></p>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
